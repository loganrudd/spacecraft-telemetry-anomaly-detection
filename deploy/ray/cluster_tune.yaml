# RayJob — Ray Tune HPO for scoring parameters on GKE Autopilot.
#
# Environment variables required before applying (cloud_tune.sh sets these):
#   PROJECT_ID   GCP project ID
#   REGION       GCP region (e.g. us-central1)
#   MLFLOW_URL   Internal Cloud Run URL for the MLflow tracking server
#   MISSION      Mission name (e.g. ESA-Mission2)
#   PROCESSED_DATA_DIR  Base dir for the hpo_portion split. cloud_tune.sh sets the
#                nominal bucket by default, or the _injected dir when INJECTED=1.
#   CHANNELS_ARG Channel selector. Nominal: --channels-from <bucket>/channels.txt;
#                injected: --channels <list> (the injected dir has no channels.txt).
#
# Apply via:
#   envsubst < deploy/ray/cluster_tune.yaml | kubectl apply -f -
#
# Sizing rationale:
#   Tune trials are pure-numpy scoring — no GPU needed.
#   Head: 2 vCPU / 8 GiB. The driver process holds errors.npy + labels for all
#   channels in each running subsystem sweep in its Python heap for the full
#   tuner.fit() duration. With max_parallel_subsystems=2, two subsystem datasets
#   live in the heap simultaneously; on a full mission this peaks at ~3.8 GiB
#   driver + ~0.7 GiB Ray daemons. 8 GiB gives ~3.5 GiB headroom. The extra
#   vCPU is required by GKE Autopilot's ≤6.5 GiB/vCPU floor, not for compute
#   (num-cpus=0 so Ray never schedules tasks on the head).
#   Workers: 4 vCPU / 4 GiB each, max 4 concurrent (one trial per CPU).

apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: spacecraft-tune
  namespace: ray
spec:
  entrypoint: >-
    bash -c 'spacecraft-telemetry --env cloud ray tune
    --mission ${MISSION}
    ${CHANNELS_ARG}
    && python -c "import gcsfs;
    gcsfs.GCSFileSystem().put(\"models/${MISSION}/tuned_configs.json\",
    \"gs://${PROJECT_ID}-artifacts/${MISSION}/tuned_configs.json\")"'

  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600

  rayClusterSpec:
    rayVersion: "2.31.0"
    enableInTreeAutoscaling: true

    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        spec:
          serviceAccountName: ray-sa
          containers:
            - name: ray-head
              image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/spacecraft-telemetry/ray:${RAY_IMAGE_TAG}
              env:
                - name: SPACECRAFT_ENV
                  value: cloud
                - name: SPACECRAFT_MLFLOW__TRACKING_URI
                  value: ${MLFLOW_URL}
                - name: SPACECRAFT_PREPROCESS__PROCESSED_DATA_DIR
                  value: ${PROCESSED_DATA_DIR}
                - name: SPACECRAFT_DATA__SAMPLE_DATA_DIR
                  value: gs://${PROJECT_ID}-sample-data
                # Experiment variant axis (plan 020) — empty string coerces to
                # None (Settings.variant), reproducing today's output layout.
                - name: SPACECRAFT_VARIANT
                  value: "${VARIANT}"
                - name: MLFLOW_ARTIFACTS_DESTINATION
                  value: gs://${PROJECT_ID}-artifacts/mlflow
                - name: SPACECRAFT_RAY__ADDRESS
                  value: auto
                # ISS=128, ESA=250 — set by cloud_tune.sh (LOS segment constraint).
                - name: SPACECRAFT_MODEL__WINDOW_SIZE
                  value: "${WINDOW_SIZE_OVERRIDE}"
                # Sweeps run one subsystem at a time, overriding tune.max_parallel_subsystems=2
                # from configs/cloud.yaml. That setting's own comment records that 2 concurrent
                # sweeps need ~8GB of head — which is exactly what the head requests below, i.e.
                # no headroom at all. ESA-Mission1 OOM-killed the head at 8.26GB of 8GiB on
                # 2026-08-15; subsystem_6 alone carries 41 of the 62 channels, so pairing it with
                # any second sweep is what pushes it over. Sequential sweeps roughly halve peak
                # head memory at the cost of wall-clock.
                #
                # Set here rather than in configs/cloud.yaml so it takes effect without an image
                # rebuild — cloud_tune.sh re-applies this YAML on every submit.
                #
                # HEAD ONLY, deliberately. run_all_sweeps reads this in the driver (the RayJob
                # entrypoint runs there) to decide how many sweeps to run at once; worker tasks
                # never read it. This is the documented exception to the "thread env vars to both
                # head and worker" rule, which exists for settings consumed inside @ray.remote
                # tasks — putting it on the worker would be dead config.
                - name: SPACECRAFT_TUNE__MAX_PARALLEL_SUBSYSTEMS
                  value: "1"
              resources:
                requests:
                  # 12Gi, not 8: headroom above the ~8GB a sweep actually needs. Do NOT raise
                  # past 13Gi without also raising cpu — GKE Autopilot caps memory at 6.5GiB per
                  # vCPU, so 2 vCPU / 16Gi is rejected (4 vCPU would be required).
                  cpu: "2"
                  memory: "12Gi"
                limits:
                  cpu: "2"
                  memory: "12Gi"
              livenessProbe:
                exec:
                  command:
                    - bash
                    - -c
                    - >-
                      wget -T 5 -q -O- http://localhost:52365/api/local_raylet_healthz
                      | grep success &&
                      wget -T 5 -q -O- http://localhost:8265/api/gcs_healthz
                      | grep success
                initialDelaySeconds: 180
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 5
              readinessProbe:
                exec:
                  command:
                    - bash
                    - -c
                    - >-
                      wget -T 5 -q -O- http://localhost:52365/api/local_raylet_healthz
                      | grep success &&
                      wget -T 5 -q -O- http://localhost:8265/api/gcs_healthz
                      | grep success
                initialDelaySeconds: 90
                periodSeconds: 10
                timeoutSeconds: 20
                failureThreshold: 10

    workerGroupSpecs:
      - groupName: cpu-workers
        replicas: 1
        minReplicas: 0
        maxReplicas: 4
        rayStartParams: {}
        template:
          spec:
            serviceAccountName: ray-sa
            containers:
              - name: ray-worker
                image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/spacecraft-telemetry/ray:${RAY_IMAGE_TAG}
                env:
                  - name: SPACECRAFT_ENV
                    value: cloud
                  - name: SPACECRAFT_MLFLOW__TRACKING_URI
                    value: ${MLFLOW_URL}
                  - name: SPACECRAFT_PREPROCESS__PROCESSED_DATA_DIR
                    value: ${PROCESSED_DATA_DIR}
                  - name: SPACECRAFT_DATA__SAMPLE_DATA_DIR
                    value: gs://${PROJECT_ID}-sample-data
                  # Must match the head's value — the @ray.remote fan-out
                  # splits inside worker tasks (plan 019 B2).
                  - name: SPACECRAFT_VARIANT
                    value: "${VARIANT}"
                  - name: MLFLOW_ARTIFACTS_DESTINATION
                    value: gs://${PROJECT_ID}-artifacts/mlflow
                  - name: SPACECRAFT_RAY__ADDRESS
                    value: auto
                  # ISS=128, ESA=250 — set by cloud_tune.sh (LOS segment constraint).
                  - name: SPACECRAFT_MODEL__WINDOW_SIZE
                    value: "${WINDOW_SIZE_OVERRIDE}"
                resources:
                  requests:
                    # 16Gi, up from 4Gi. run_hpo_sweep ray.put()s the whole subsystem's
                    # channel_data AND nominal_errors via tune.with_parameters, so the worker's
                    # object store must hold every channel in the sweep at once. subsystem_6 is
                    # 41 of ESA-Mission1's 62 channels at ~30MB each (errors.npy measured at
                    # 23.6MB + per-window labels) — roughly 2.4GB of shared arrays. Ray sizes the
                    # object store at ~30% of node memory, so 4Gi gave it ~1.2GB and the sweep
                    # OOM-killed the worker on 2026-08-15 with 4 concurrent trials running.
                    # 16Gi leaves ~4.8GB of object store plus headroom for the trials themselves.
                    #
                    # Ratio is 4.0 GiB/vCPU, within Autopilot's 6.5 cap (4 vCPU allows 26Gi).
                    cpu: "4"
                    memory: "16Gi"
                  limits:
                    cpu: "4"
                    memory: "16Gi"
